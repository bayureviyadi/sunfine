<title>Admin Pesanan – Lakban Sunfine</title>
<style>
:root{--bg:#f4f7f2;--card:#fff;--ink:#12301f;--mut:#5b6e61;--g:#0f5c35;--g2:#0a4426;--y:#fcb824;--line:#d9e3dc;--inp:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0c1a12;--card:#13271b;--ink:#eef5f0;--mut:#9db3a4;--line:#254232;--inp:#0f2016}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 40px}
header{background:linear-gradient(160deg,var(--g2),var(--g));color:#fff;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{margin:0;font-size:18px}
header button{background:rgba(0,0,0,.3);color:#fff;border:0;padding:8px 14px;border-radius:10px;font-weight:600;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
label{display:block;font-size:14px;font-weight:600;margin:10px 0 5px}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--inp);color:var(--ink);font:inherit}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--y);color:#3a2a00;font:inherit;font-weight:700}
.btn.full{width:100%;margin-top:14px}
.err{color:#d33;font-size:13px;min-height:16px;margin-top:8px}
.hide{display:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 2px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:99px;font-weight:600;cursor:pointer;font:inherit;font-weight:600}
.chip.on{background:var(--y);color:#3a2a00;border-color:var(--y)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.top b{font-size:16px}
.kode{font-size:12px;color:var(--mut)}
.st{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800;text-transform:uppercase;white-space:nowrap}
.st.baru{background:#fcb824;color:#3a2a00}.st.diproses{background:#3b82f6;color:#fff}.st.dikirim{background:#8b5cf6;color:#fff}.st.selesai{background:#16a34a;color:#fff}.st.batal{background:#9ca3af;color:#fff}
ul{margin:8px 0;padding-left:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row select{flex:1;min-width:130px;padding:10px}
.row a,.row button{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--inp);color:var(--ink);font:inherit;font-weight:600;text-decoration:none;cursor:pointer}
.row a.wa{background:#25d366;color:#06310f;border:0}
.row button.del{color:#d33}
.sum{display:flex;justify-content:space-between;margin-top:14px;color:var(--mut);font-size:14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.tile{background:var(--inp);border:1px solid var(--line);border-radius:12px;padding:10px}
.tile small{display:block;color:var(--mut);font-size:12px}
.tile b{font-size:16px}
.tile.big{grid-column:1/-1;border-color:var(--y)}
.tile.big b{font-size:22px}
.alo{margin-top:10px;font-size:13px}
.alo .bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:3px 0 8px}
.alo .bar i{display:block;height:100%;background:var(--y)}
.alo .l{display:flex;justify-content:space-between;gap:8px}
.hr{display:flex;gap:8px;margin-top:10px}
.hr input{flex:1}
.hr button{border:0;border-radius:12px;padding:0 16px;font-weight:700;background:var(--y);color:#3a2a00;cursor:pointer}
.sm{font-size:12px;color:var(--mut);margin-top:6px}
.pl{font-size:13px;margin-top:6px;padding:6px 10px;border-radius:10px;background:var(--inp);border:1px dashed var(--line)}
.donebtn{width:100%;margin-top:12px;padding:12px;border:0;border-radius:12px;background:#16a34a;color:#fff;font:inherit;font-weight:800;cursor:pointer}
.donebtn.undo{background:var(--inp);color:var(--ink);border:1px solid var(--line)}
.bulkbtn{width:100%;margin-top:10px;padding:10px;border-radius:12px;border:1px solid #d33;background:transparent;color:#d33;font:inherit;font-weight:700;cursor:pointer}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;overflow:auto}
.mod.hide{display:none}
.mod .card{width:100%;max-width:440px;margin:0}
.empty{text-align:center;color:var(--mut);padding:30px 0}
.req{margin-top:10px;padding:10px 12px;border-radius:12px;border:1px solid #d33;background:rgba(221,51,51,.08);font-size:14px;font-weight:600}
.row button.ok{background:#d33;color:#fff;border:0}
.pp{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:1000}
.ppc{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:20px 18px 16px;width:100%;max-width:360px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.ppi{font-size:34px;line-height:1}
.ppt{font-size:17px;font-weight:800;margin-top:8px}
.ppm{font-size:14px;color:var(--mut);margin-top:8px;white-space:pre-line;word-break:break-word}
.ppb{display:flex;gap:8px;margin-top:16px}
.ppb button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--inp);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.ppb .ppo{background:var(--y);color:#3a2a00;border:0}
.ppb .ppo.dg{background:#d33;color:#fff}
</style>
</head>
<body>
<header><h1>📦 Admin Pesanan Lakban</h1><button id="out" class="hide">Keluar</button></header>
<div class="wrap">

<div class="card" id="login">
<b>Masuk admin</b>
<label for="em">Email</label><input id="em" type="email" autocomplete="username">
<label for="pw">Kata sandi</label><input id="pw" type="password" autocomplete="current-password">
<div class="err" id="lerr"></div>
<button class="btn full" id="go">Masuk</button>
</div>

<div id="panel" class="hide">
<div class="card" id="rep">
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><b>💰 Laporan Laba</b>
<select id="per" style="width:auto;padding:8px 10px"><option value="semua">Semua waktu</option><option value="hari">Hari ini</option><option value="7">7 hari terakhir</option><option value="bulan">Bulan ini</option></select></div>
<div id="repBody"></div>
<label for="hpp">Modal beli per karton (72 roll / 12 slop)</label>
