<title>Pesanan Saya – Lakban Sunfine</title>
<style>
:root{--bg:#f4f7f2;--card:#fff;--ink:#12301f;--mut:#5b6e61;--g:#0f5c35;--g2:#0a4426;--y:#fcb824;--line:#d9e3dc;--inp:#fff;--pr:#0f5c35}
@media (prefers-color-scheme:dark){:root{--bg:#0c1a12;--card:#13271b;--ink:#eef5f0;--mut:#9db3a4;--line:#254232;--inp:#0f2016;--pr:#fcb824}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}
header{background:linear-gradient(160deg,var(--g2),var(--g));color:#fff;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 22px;border-radius:0 0 24px 24px}
header .in{max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{margin:0;font-size:22px}
header a{color:#fff;font-weight:700;font-size:14px;background:rgba(0,0,0,.28);padding:8px 14px;border-radius:99px;text-decoration:none;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.top b{font-size:16px}
.kode{font-size:12px;color:var(--mut)}
.st{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800;text-transform:uppercase;white-space:nowrap}
.st.baru{background:#fcb824;color:#3a2a00}.st.diproses{background:#3b82f6;color:#fff}.st.dikirim{background:#8b5cf6;color:#fff}.st.selesai{background:#16a34a;color:#fff}.st.batal{background:#9ca3af;color:#fff}
.steps{display:flex;margin:14px 0 6px}
.steps div{flex:1;text-align:center;font-size:11px;color:var(--mut);position:relative}
.steps div:before{content:"";display:block;width:14px;height:14px;border-radius:50%;background:var(--line);margin:0 auto 4px;position:relative;z-index:1}
.steps div:after{content:"";position:absolute;top:6px;left:-50%;width:100%;height:3px;background:var(--line)}
.steps div:first-child:after{display:none}
.steps div.on{color:var(--ink);font-weight:700}
.steps div.on:before,.steps div.on:after{background:var(--y)}
ul{margin:8px 0;padding-left:18px}
.info{font-size:14px;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row button{flex:1;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--inp);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.row button.wa{background:#25d366;color:#06310f;border:0;font-weight:800}
.row button.cx{color:#d33;border-color:#d33}
.row button:disabled{opacity:.55;cursor:default}
.tabs{display:flex;gap:8px;margin-top:14px}
.tab{flex:1;padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.tab.on{background:var(--y);color:#3a2a00;border-color:var(--y)}
.note2{font-size:14px;font-weight:700;margin-top:4px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.empty a{display:inline-block;margin-top:14px;background:var(--y);color:#3a2a00;font-weight:800;padding:12px 20px;border-radius:12px;text-decoration:none}
.note{font-size:13px;color:var(--mut);text-align:center;margin-top:18px}
.pp{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:1000}
.ppc{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:20px 18px 16px;width:100%;max-width:360px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.ppi{font-size:34px;line-height:1}
.ppt{font-size:17px;font-weight:800;margin-top:8px}
.ppm{font-size:14px;color:var(--mut);margin-top:8px;white-space:pre-line;word-break:break-word}
.ppb{display:flex;gap:8px;margin-top:16px}
.ppb button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--inp);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.ppb .ppo{background:var(--y);color:#3a2a00;border:0}
.ppb .ppo.dg{background:#d33;color:#fff}
</style>
</head>
